# BOTFORGE default print profile — PLA, 0.20 mm layers, support-free parts.
# Loaded by the engine's print-plan generator via `prusa-slicer --load`.
# Matches the CAD rule set: all parts must print without supports.

[print]
layer_height = 0.2
first_layer_height = 0.25
perimeters = 3
top_solid_layers = 4
bottom_solid_layers = 4
fill_density = 15%
fill_pattern = gyroid
support_material = 0
support_material_auto = 0
brim_width = 0
skirts = 1
skirt_distance = 3
seam_position = nearest
perimeter_speed = 45
infill_speed = 80
travel_speed = 150
external_perimeter_speed = 25
first_layer_speed = 20

[filament]
filament_type = PLA
filament_diameter = 1.75
filament_density = 1.24
extrusion_multiplier = 1
temperature = 210
first_layer_temperature = 215
bed_temperature = 60
first_layer_bed_temperature = 60

[printer]
nozzle_diameter = 0.4
max_print_height = 250
bed_shape = 0x0,220x0,220x220,0x220
retract_length = 0.8
retract_speed = 35
gcode_flavor = marlin
