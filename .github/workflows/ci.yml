name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --check .
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --project packages/engine
      - run: uv run --project packages/engine ruff check packages/engine/src packages/engine/tests

  test-js:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  test-py:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --project packages/engine
      - run: uv run --project packages/engine pytest packages/engine/tests -q

  engine-build:
    runs-on: ubuntu-latest
    needs: test-py
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build engine image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/engine.Dockerfile
          tags: botforge-engine:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build robots inside engine container
        run: |
          docker run --rm -v "$PWD:/work" -w /work botforge-engine:ci bash -eu -c '
            uv sync --project packages/engine --all-extras
            if [ -d robots/_test-min ]; then
              uv run --project packages/engine botforge build robots/_test-min
              uv run --project packages/engine botforge build robots/rover-v1
              uv run --project packages/engine pytest packages/engine/tests -q
            else
              echo "No robots authored yet (pre-Phase-1) — skipping engine build step."
            fi
          '
      - name: Upload dist artifacts
        if: hashFiles('dist/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  firmware-build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: pip install platformio
      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('packages/firmware/platformio.ini') }}
      - name: Native VM tests
        run: pio test -d packages/firmware -e native
      - name: Build esp32s3 firmware
        run: pio run -d packages/firmware -e esp32s3
      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: packages/firmware/.pio/build/esp32s3/firmware.bin

  web-build:
    runs-on: ubuntu-latest
    needs: test-js
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  release:
    # Tag builds: attach firmware binaries to a GitHub Release.
    # Supabase Storage sync is added in Phase 4 when the project exists.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [engine-build, firmware-build, web-build]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: release-assets/
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**
