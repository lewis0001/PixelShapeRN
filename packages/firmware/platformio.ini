; botforge firmware — Phase 0 PlatformIO project
;
; Two environments:
;   esp32s3 — the real target (ESP32-S3-DevKitC-1, Arduino framework)
;   native  — host-side unit tests (Unity, PlatformIO's default test framework)

[platformio]
default_envs = esp32s3

[env:esp32s3]
; NOTE on platform choice:
; The plan requires arduino-esp32 core 3.x (based on ESP-IDF 5.x). The official
; PlatformIO "espressif32" platform (<= 6.x) is frozen on arduino-esp32 core 2.x
; and does NOT support core 3.x. We therefore use the community-maintained
; pioarduino fork of the platform, which packages arduino-esp32 3.x
; (release 54.03.20 == arduino-esp32 3.2.0 / ESP-IDF 5.4.x).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
monitor_speed = 115200
build_flags =
    ; Route Serial to the S3's native USB port and enable CDC at boot,
    ; so `pio device monitor` works over the on-board USB connector.
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
; Phase-2 driver/protocol libraries (target-only; see comments per line).
; WebSocket server choice: plain WebServer.h (bundled with arduino-esp32) for
; HTTP + links2004/WebSockets for the port-81 WS server. Chosen over
; ESPAsyncWebServer because both are synchronous, single-threaded, boring, and
; extremely well covered in training data / community docs; async adds a whole
; class of re-entrancy bugs we don't need at 5 Hz telemetry.
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    madhephaestus/ESP32Servo@^3.0.5
    pololu/VL53L0X@^1.3.1
    adafruit/Adafruit NeoPixel@^1.12.3
    links2004/WebSockets@^2.6.1

[env:native]
; Host build for unit tests only (no Arduino APIs). src/main.cpp is excluded
; from this environment via the NATIVE_BUILD guard.
platform = native
build_flags =
    -std=gnu++17
    -DNATIVE_BUILD
; ArduinoJson is header-only, platform-agnostic C++ and is required by the
; native tests (config.json parsing in test_core, BSJ parsing in test_vm).
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
; Tests intended for the host live under test/native/.
test_filter = native/*
