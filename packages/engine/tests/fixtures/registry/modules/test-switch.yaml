# A passive slide switch: no firmware block.
id: test-switch
name: Test slide switch
category: passive
electrical:
  vcc: "n/a"
  logic_v: 3.3
  current_ma: { typ: 0, max: 0 }
  pins:
    - { name: a, type: switch, required: false }
    - { name: b, type: switch, required: false }
mech:
  dims_mm: [12, 6, 5]
