  mount: { pattern: snapless_lip, screws: m2x6 }
wiring:
  connector: solder_tab
  wire_colors: { a: red, b: red }
sourcing:
  - { vendor: test, label: "Test switch", url: "https://example.com/switch", price_usd: 0.2, affiliate_key: t }
docs:
