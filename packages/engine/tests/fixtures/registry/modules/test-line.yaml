  wire_colors: { vcc: red, gnd: black, out: white }
sourcing:
  - { vendor: test, label: "Test line sensor", url: "https://example.com/line", price_usd: 1.0, affiliate_key: t }
docs:
  blurb: Fixture analog line sensor.
sim:
  kind: line_ir
