[project]
name = "botforge-engine"
version = "0.1.0"
description = "BOTFORGE engine — compiles robot manifests into every artifact."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "numpy>=2.4.6",
    "wireviz>=0.4",
]

[project.scripts]
botforge = "botforge_engine.cli:app_main"

[project.optional-dependencies]
cad = [
    "cadquery>=2.8",
    "numba>=0.60",
    "pillow>=10",
    "pyrender>=0.1.45",
    "trimesh>=4.4",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/botforge_engine"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
environments = ["sys_platform == 'linux'"]
